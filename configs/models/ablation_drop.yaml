# Ablation: champion binary config with Attempted flows dropped instead of relabelled benign.
experiment: secops/detection-ablations
run_name: lightgbm_none_attempted_drop
task: binary
model: lightgbm
weighting: none
feature_spec: v1-noport
split_strategy: chrono_within_group
attempted_policy: drop
max_fpr: 0.01
shap_sample: 20000
