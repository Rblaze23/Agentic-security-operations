[project]
name = "secops"
version = "0.1.0"
description = "Agentic Security Operations Platform: ML intrusion detection and evidence-grounded alert investigation"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.4",
  "shap>=0.46",
  "mlflow>=2.16",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "typer>=0.12",
  "matplotlib>=3.9",
  "requests>=2.32",
  "tabulate>=0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[project.scripts]
secops-data = "secops.data.cli:app"
secops-train = "secops.detection.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "types-PyYAML",
  "types-requests",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101", "N803", "N806"]  # X, X_train: the ML naming convention

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: slower tests that run the pipelines on the fixture",
  "network: opt-in tests that call external services",
]
addopts = "-q -m 'not network'"
